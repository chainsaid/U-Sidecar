name: Build

on:
  workflow_dispatch:
    inputs:
      net480:
        description: Target .NET 4.8
        type: boolean
        default: false
      debug:
        description: Build in debug mode
        type: boolean
        default: false

  workflow_call:
    outputs:
      artifact-id:
        description: Uploaded artifact ID
        value: ${{ jobs.build.outputs.artifact-id }}
      artifact-name:
        description: Uploaded artifact name
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.artifact-upload-step.outputs.artifact-id }}
      artifact-name: ${{ steps.prepare-output-step.outputs.artifact-name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prepare envars
        run: |
          echo "SHORT_SHA=$("${{ github.sha }}" | cut -c1-8)" >> $env:GITHUB_ENV
          echo "APP_VERSION=$((Get-Content -Path "app\Program.cs" | Select-String -Pattern 'AppVersion\s=\s"(.+)"' -AllMatches).Matches.Groups[1].Value)" >> $env:GITHUB_ENV
          echo "BUILD_CONFIG=${{ inputs.debug && 'Debug' || 'Release' }}" >> $env:GITHUB_ENV

      - name: Target .NET 4.8
        if: ${{ inputs.net480 }}
        run: |
          (Get-Content app\D92Streaming.csproj) -replace "TargetFramework>net472", "TargetFramework>net480" | Out-File app\D92Streaming.csproj
          (Get-Content app\App.config) -replace "Version=v4.7.2", "Version=v4.8" | Out-File app\App.config

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v2

      - name: Build app
        run: |
          cd app
          msbuild D92Streaming.csproj /t:Restore
          msbuild D92Streaming.csproj /t:Build /p:Configuration=${{ env.BUILD_CONFIG }} /p:Platform=AnyCPU

      - name: Stage build output
        id: prepare-output-step
        # Copies into a flat top-level "stage\" folder (rather than
        # uploading app/bin/<config>/... paths directly) so the artifact's
        # internal layout is flat -- publish.yml's SignPath step downloads
        # this artifact and writes signed output into a plain "bin\" folder,
        # and both Compress-Archive and setup.iss expect flat files there,
        # not a nested app/bin/<config>/ path.
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          $src = "app\bin\${{ env.BUILD_CONFIG }}"
          echo "${{ env.APP_VERSION }}+${{ env.SHORT_SHA }}" | Out-File -Encoding ascii stage\version
          Copy-Item "$src\vdd.cmd" stage\
          Copy-Item "$src\D92Streaming.exe" stage\
          Copy-Item "$src\D92Streaming.exe.config" stage\
          echo "artifact-name=D92Streaming-v${{ env.APP_VERSION }}-${{ env.SHORT_SHA }}" >> $env:GITHUB_OUTPUT

      - name: Upload build output
        uses: actions/upload-artifact@v4
        id: artifact-upload-step
        with:
          name: ${{ steps.prepare-output-step.outputs.artifact-name }}
          path: stage/*
          if-no-files-found: error
